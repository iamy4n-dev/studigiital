name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "scaffold/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm turbo build

      - name: Typecheck mobile
        run: pnpm --filter @studigiital/mobile typecheck

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync --all-extras

      - name: Lint (ruff)
        working-directory: apps/backend
        run: uv run ruff check .

      - name: Type-check (mypy)
        working-directory: apps/backend
        run: uv run mypy src/

      - name: Health check (import test)
        working-directory: apps/backend
        run: uv run python -c "from app.main import app; assert app.title == 'Studigital API'"
